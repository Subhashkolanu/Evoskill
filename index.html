<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>EvoSkill AI — Editorial Career Accelerator & Intelligent Roadmap Platform</title>
    <meta name="title" content="EvoSkill AI — Career Accelerator & Intelligent Learning Platform" />
    <meta name="description" content="Discover your ideal career path with personalized, project-based learning roadmaps, real-world portfolios, skill-gap analysis, and dedicated AI mentoring." />
    <meta name="keywords" content="career development, AI career coach, learning roadmap, skill gap analysis, portfolio lab, EvoSkill AI" />
    <meta name="theme-color" content="#263A32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evoskill.ginnela.in/" />
    <meta property="og:title" content="EvoSkill AI — Career Accelerator & Learning Platform" />
    <meta property="og:description" content="Discover your ideal career path with personalized, project-based learning roadmaps and dedicated AI mentoring." />
    <meta property="og:image" content="https://evoskill.ginnela.in/og-image.png" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://evoskill.ginnela.in/" />
    <meta property="twitter:title" content="EvoSkill AI — Career Accelerator & Learning Platform" />
    <meta property="twitter:description" content="Discover your ideal career path with personalized learning roadmaps." />
    <meta property="twitter:image" content="https://evoskill.ginnela.in/og-image.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EvoSkill AI",
      "url": "https://evoskill.ginnela.in/",
      "description": "Personalized Career Accelerator and Learning Roadmap Platform",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Warm Editorial Pre-React Styling -->
    <style>
      :root {
        --warm-ivory: #F4F0E6;
        --forest-ink: #263A32;
        --terracotta: #C66E4E;
      }
      body {
        margin: 0;
        background-color: #F4F0E6;
        color: #263A32;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .seo-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        text-align: center;
        padding: 32px;
      }
      .seo-loader h1 {
        font-family: 'Fraunces', Georgia, serif;
        color: #263A32;
        font-size: 2.75rem;
        margin-bottom: 1rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .seo-loader p {
        color: #343D50;
        max-width: 580px;
        font-size: 1.125rem;
        line-height: 1.6;
      }
      .loader-badge {
        display: inline-block;
        margin-top: 2rem;
        padding: 6px 16px;
        border-radius: 9999px;
        background: #EEF3F1;
        color: #263A32;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="seo-loader">
        <h1>EvoSkill AI</h1>
        <p>A modern, editorial career development platform. Discover suitable career paths, master verified skill roadmaps, build real-world portfolios, and prepare for interviews with an AI mentor.</p>
        <div class="loader-badge">Initialising workspace...</div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
